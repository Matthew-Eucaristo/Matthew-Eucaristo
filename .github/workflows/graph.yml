name: graph

on:
  push:
    branches: [main]
    paths: [graph/**, .github/workflows/graph.yml]
  schedule:
    - cron: "17 3 * * 1" # weekly: picks up new tap formulas and visibility changes
  workflow_dispatch:

concurrency:
  group: graph
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 graph/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git add assets/graph-*.svg docs/graph.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "graph: regenerate"
          git push
